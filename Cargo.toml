# SPDX-License-Identifier: Apache-2.0

[package]
name = "pygrpc_native"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "A gRPC server in Rust that hands calls to Python handlers in batches"
repository = "https://github.com/pygrpc/pygrpc-native"
# tonic 0.14 needs rustc 1.88.
rust-version = "1.88"

[lib]
name = "pygrpc_native"
crate-type = ["cdylib"]

[features]
# Disable extension-module for cargo test so test binaries link to libpython.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
bytes = "1.9"
crossbeam-channel = "0.5"
futures-core = "0.3"
h2 = "0.4"
http = "1"
http-body = "1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
log = "0.4"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-log = "0.13"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tonic = { version = "0.14", default-features = false, features = ["server", "gzip"] }

# The per-call path crosses crates (hyper, h2, tonic); let them inline.
[profile.release]
lto = "thin"
codegen-units = 1

# grpc-core sends a Unix socket path, percent-encoded, as :authority, which
# http 1.5 rejects (hyperium/http#836). The copy allows valid escapes in the
# host. Drop it once upstream does.
[patch.crates-io]
http = { path = "vendor/http" }
