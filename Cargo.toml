# SPDX-License-Identifier: Apache-2.0

[package]
name = "pygrpc_native"
version = "0.8.1"
edition = "2021"
license = "Apache-2.0"
description = "A gRPC server in Rust that hands calls to Python handlers in batches"
repository = "https://github.com/pygrpc/pygrpc-native"
# tonic 0.14 needs rustc 1.88.
rust-version = "1.88"

[lib]
name = "pygrpc_native"
crate-type = ["cdylib"]

[features]
# Disable extension-module for cargo test so test binaries link to libpython.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
base64 = "0.23"
bytes = "1.9"
crossbeam-channel = "0.5"
futures-core = "0.3"
h2 = "0.4"
http = "1"
http-body = "1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
log = "0.4"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-log = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
# "all" for set_reuse_port.
socket2 = { version = "0.6", features = ["all"] }
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tonic = { version = "0.14", default-features = false, features = ["server", "gzip", "deflate"] }
x509-parser = { version = "0.18", default-features = false }

# The per-call path crosses crates (hyper, h2, tonic); let them inline.
[profile.release]
lto = "thin"
codegen-units = 1

# h2 resets a call whose :authority http can't parse, and grpc-core can send
# one: a percent-encoded Unix socket path (hyperium/http#836) or the address
# list of an ipv4: target. The copy lets these through. Drop it once h2 does.
[patch.crates-io]
http = { path = "vendor/http" }
