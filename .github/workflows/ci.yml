name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # rustfmt and clippy run in the rust job.
      - run: |
          python -m pip install pre-commit
          SKIP=rust-fmt,rust-clippy pre-commit run --all-files --show-diff-on-failure

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features

  python:
    # Keeps the names of the jobs that branch protection requires.
    name: python (${{ matrix.os }}, ${{ matrix.python }}${{ matrix.grpcio && format(', grpcio {0}', matrix.grpcio) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
        grpcio: [""]
        include:
          # The first grpcio whose generated code adds registered handlers.
          - os: ubuntu-latest
            python: "3.10"
            grpcio: "1.64.3"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install
        run: |
          if [ -n "${{ matrix.grpcio }}" ]; then pin="==${{ matrix.grpcio }}"; fi
          python -m pip install maturin pytest uvloop "grpcio$pin" "grpcio-tools$pin" "grpcio-health-checking$pin" "grpcio-reflection$pin"
          # Interceptor libraries that downstream servers use, for tests/test_downstream.py.
          python -m pip install grpc-interceptor opentelemetry-instrumentation-grpc
          if [ -n "$pin" ]; then
            python -c "import grpc; assert grpc.__version__ == '${{ matrix.grpcio }}', grpc.__version__"
          fi
          maturin build --release --locked --out dist
          python -m pip install dist/*.whl
      - run: pytest -q tests

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install
        run: |
          python -m pip install maturin grpcio grpcio-tools
          maturin build --release --locked --out dist
          python -m pip install dist/*.whl
          GOBIN="$RUNNER_TEMP" go install google.golang.org/grpc/interop/client@v1.77.0
      - run: python interop/run.py --go-client "$RUNNER_TEMP/client" --table interop-results.md
      - if: always()
        run: cat interop-results.md >> "$GITHUB_STEP_SUMMARY"
