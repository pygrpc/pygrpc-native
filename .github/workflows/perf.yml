name: Perf

# Compares a change with its base on the same runner. Advisory: the job passes
# and the results go to the job summary, and perf-comment.yml posts them on
# the pull request.

on:
  pull_request:
    paths:
      - "src/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "benchmarks/regress.py"
      - ".github/workflows/perf.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "Ref to compare against (default: the same commit)"
        required: false

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  GRPCIO: "1.85.1"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 2
      - name: Pick the base
        id: base
        env:
          INPUT_BASE: ${{ inputs.base }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The merge commit's first parent, so only the PR's changes differ.
            echo "ref=$(git -C head rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${INPUT_BASE:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.ref }}
          path: base
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build both
        run: |
          python -m pip install maturin "grpcio==$GRPCIO"
          for b in base head; do
            (cd "$b" && maturin build --release --locked --out "../dist-$b")
            python -m venv "venv-$b"
            "venv-$b/bin/pip" install "grpcio==$GRPCIO" dist-$b/*.whl
          done
      - name: Compare
        run: |
          python head/benchmarks/regress.py \
            --base venv-base/bin/python --head venv-head/bin/python \
            --json results.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Note the pull request
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ steps.base.outputs.ref }}
        run: echo "{\"pr\": $PR, \"base\": \"$BASE\"}" > pr.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-results
          path: |
            results.json
            pr.json
